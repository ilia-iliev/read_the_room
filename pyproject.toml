[project]
name = "track2"
version = "0.1.0"
description = "Read the Room — navigate a complex social situation, directed by AI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio==6.16.0",
    "dspy==3.2.1",
    # <=2.12.5: HF Spaces install gradio[oauth,mcp], whose mcp extra caps pydantic
    "pydantic==2.12.5",
    "python-dotenv>=1.2.2",
    "huggingface-hub>=1.19.0",
    "pillow>=12.2.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
]
infra = [
    "modal==1.4.3",
]
